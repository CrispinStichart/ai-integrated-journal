name: ai-integrated-journal

services:
  postgres:
    build:
      context: ./postgres
    image: ai-integrated-journal-postgres:pg17-pgvector0.8.1
    environment:
      POSTGRES_DB: journal
      POSTGRES_PASSWORD: ${JOURNAL_DATABASE_PASSWORD:-journal-local-only}
      POSTGRES_USER: journal
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username journal --dbname journal']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
    name: ai-integrated-journal-postgres-data
